name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # The suite, in the distribution Scute is packaged for.
  #
  # Not a matter of taste: Scute calls seccomp_export_bpf_mem, which arrived in
  # libseccomp 2.6, and Ubuntu 24.04 carries 2.5.5.  A runner's own image tests
  # a configuration the package does not support and cannot run on.
  #
  # A container is built to withhold exactly what these tests need -- Landlock,
  # user namespaces, and a cgroup tree that can be written to -- so it is given
  # them back and the suite is then run by an ordinary user, because "none of
  # this needs root" is the claim being tested.
  # ------------------------------------------------------------------
  check:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
      options: --privileged --cgroupns=private
    steps:
      - name: Install SBCL, ocicl and the broker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dnf install -y sbcl libseccomp gcc make git tar gzip findutils \
            groff procps-ng iproute sudo shadow-utils which jq
          curl -o /etc/yum.repos.d/ocicl.repo \
            https://ocicl.github.io/ocicl/rpm-repo/ocicl.repo
          dnf install -y ocicl
          # KeyFence from its release asset rather than its repository, which
          # publishes unsigned repodata while its own .repo file asks dnf to
          # check the signature -- so "dnf install keyfence" cannot resolve
          # until that is fixed on the KeyFence side.
          dnf install -y "$(curl -sH "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/atgreen/keyfence/releases/latest \
            | jq -r '.assets[] | select(.name | endswith(".x86_64.rpm"))
                     | .browser_download_url' | head -1)"

      - uses: actions/checkout@v4

      # ocicl.csv pins every dependency, so the key is the whole answer: a
      # changed pin is a changed tree, and an unchanged one need not be fetched.
      - name: Cache the dependency tree
        uses: actions/cache@v4
        with:
          path: ocicl
          key: ocicl-fedora-${{ hashFiles('ocicl.csv') }}

      - name: A user to build and test as
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder:builder .

      - name: Fetch dependencies
        run: sudo -u builder -H sh -c 'ocicl setup > ~/.sbclrc && ocicl install'

      - name: Build
        run: sudo -u builder -H make

      # Informational, and deliberately before the suite: when a test fails for
      # want of something the host does not have, this is the step that says so.
      - name: What this host can enforce
        run: sudo -u builder -H ./scute doctor || true

      # Two tests want the certificate authority the broker writes on first
      # start, which on a workstation a user service has already done.  Mint it
      # and stop again rather than leave one running: Scute starts a broker per
      # run with a control key of its own, and one already listening is one it
      # cannot authenticate to.  The broker will not start without a key, which
      # is why this cannot just be "keyfence &".
      - name: Mint the broker's certificate authority
        run: |
          sudo -u builder -H sh -c '
            keyfence --api-key ci-only >/tmp/keyfence.log 2>&1 &
            pid=$!
            for _ in $(seq 60); do
              [ -f ~/.keyfence/ca/ca.pem ] && break
              sleep 1
            done
            kill "$pid" 2>/dev/null || true'
          test -f /home/builder/.keyfence/ca/ca.pem

      - name: Test and smoke
        run: sudo -u builder -H releng/ci-host.sh make check

  # ------------------------------------------------------------------
  # The package, built the way the release builds it and installed the way a
  # reader of the README installs it.  Unsigned and thrown away: this asks
  # whether the spec still describes the tree, and whether the dependencies
  # resolve against the repositories people are told to enable -- neither of
  # which the suite above would notice breaking.
  # ------------------------------------------------------------------
  rpm:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Install build tools
        run: |
          dnf install -y rpm-build rpmdevtools sbcl gcc make git tar gzip findutils
          curl -o /etc/yum.repos.d/ocicl.repo \
            https://ocicl.github.io/ocicl/rpm-repo/ocicl.repo
          dnf install -y ocicl

      - uses: actions/checkout@v4

      - name: Fetch dependencies
        run: |
          ocicl setup > ~/.sbclrc
          ocicl install

      - name: Build the RPM
        run: make rpm

      - name: Install it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dnf install -y jq
          dnf install -y "$(curl -sH "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/atgreen/keyfence/releases/latest \
            | jq -r '.assets[] | select(.name | endswith(".x86_64.rpm"))
                     | .browser_download_url' | head -1)"
          dnf install -y ./build/rpm/RPMS/*/*.rpm
          rpm -qlv scute
          scute --version

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-unsigned
          path: build/rpm/RPMS/*/*.rpm
          retention-days: 7
